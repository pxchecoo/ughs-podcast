name: Remove Centeno moderator once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-centeno-once.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update moderators section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          pattern = r'''\s*<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:120px;">\s*<img src="assets/oscar-centeno\.webp"[^>]*?/?>\s*<span[^>]*>Prof\. Oscar Centeno</span>\s*</div>\s*'''
          text, removed = re.subn(pattern, '\n', text, count=1, flags=re.S)
          if removed != 1:
              raise SystemExit('Oscar Centeno moderator block was not found exactly once.')

          old = '<div class="socials" style="width: 100%; justify-content: space-between; gap: 18px;">'
          new = '<div class="socials" style="width:100%; justify-content:center; gap:clamp(28px, 8vw, 96px); flex-wrap:wrap;">'
          if old not in text:
              raise SystemExit('Moderators layout container was not found.')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm -f assets/oscar-centeno.webp
          rm -f .github/workflows/remove-centeno-once.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Oscar Centeno from moderators"
          git push
